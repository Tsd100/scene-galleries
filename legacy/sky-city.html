<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1c29">
<meta name="description" content="在暮色与云海之间，漫游一座被巨树守护的天空之城。离线观赏场景。">
<title>天空之城 · 云上漫游</title>
<style>
:root { color-scheme: dark; --night-blue:#0c1c29; --twilight:#526a74; --copper:#d4b783; --moss:#758575; --cream:#eee7d4; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--night-blue); color:var(--cream); }
body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
button { font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible { outline:2px solid #fff0b5; outline-offset:7px; }
button:disabled { cursor:default; }
[hidden] { display:none !important; }
.scene-app { position:relative; isolation:isolate; min-height:100svh; }
.scene-stage { position:relative; height:100svh; min-height:660px; overflow:hidden; background:var(--night-blue); }
.sky-layer { position:absolute; inset:0; background:linear-gradient(180deg,#081b2a,#3a5963 54%,#d0a77e 100%); }
.art-layer { position:absolute; inset:0; pointer-events:none; }
#world-art { display:block; width:100%; height:100%; }
.atmosphere { position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg,rgba(7,21,30,.68),transparent 52%),linear-gradient(0deg,rgba(6,18,28,.92),transparent 25%); }
.vignette { position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 150px 25px #07182777; }
.grain { position:absolute; inset:0; pointer-events:none; opacity:.07; }
.scene-topbar { position:absolute; top:max(32px,env(safe-area-inset-top)); left:4.8%; right:4.8%; display:flex; align-items:center; justify-content:space-between; gap:16px; z-index:4; }
.wordmark { display:flex; gap:14px; align-items:center; font-size:11px; letter-spacing:.2em; }
.brand-seal { width:28px; height:28px; border:1px solid #d4b78388; display:grid; place-items:center; transform:rotate(45deg); }
.brand-seal span { transform:rotate(-45deg); font-family:serif; font-size:15px; }
.wordmark small { display:block; margin-top:5px; color:#c2c7bf; font-size:9px; letter-spacing:.28em; }
.top-actions { display:flex; align-items:center; gap:26px; }
.mode-label { font-size:10px; letter-spacing:.13em; color:#d7d7c9; }
.mode-label::before { content:""; display:inline-block; width:4px; height:4px; background:#ddc694; border-radius:50%; margin-right:9px; box-shadow:0 0 8px #dfc27a; }
.text-button { min-height:44px; min-width:44px; flex-shrink:0; border:0; background:transparent; padding:8px 0 8px 12px; font-size:11px; letter-spacing:.08em; }
.text-button:hover { color:#ffdfa4; }
.scene-copy { position:absolute; left:7.6%; top:24%; width:34%; max-width:470px; z-index:2; }
.eyebrow { display:flex; gap:14px; align-items:center; color:var(--copper); font-size:10px; letter-spacing:.32em; margin:0 0 28px; }
.eyebrow::before { content:""; width:38px; height:1px; background:var(--copper); }
h1 { font-family:"Songti SC","STSong","SimSun",serif; font-size:clamp(46px,5.6vw,84px); font-weight:400; line-height:1.25; letter-spacing:.15em; margin:0 0 22px; text-shadow:0 3px 30px #081721; }
h1:focus { outline:none; }
.scene-tagline { font-family:"Songti SC","STSong","SimSun",serif; font-size:clamp(16px,1.5vw,23px); line-height:1.8; letter-spacing:.18em; color:#dfd7c2; margin:0; }
.copy-divider { margin:30px 0 21px; width:26px; height:1px; background:#d4b78388; }
#scene-description { max-width:290px; font-size:12px; line-height:2.15; letter-spacing:.09em; color:#c3ccc5; margin:0; }
.scene-index { margin:25px 0 0; font-family:Georgia,serif; font-size:11px; letter-spacing:.16em; color:#aab5af; }
.scene-index strong { color:var(--copper); font-size:18px; font-weight:400; }
.scene-hotspots { position:absolute; inset:0; z-index:3; pointer-events:none; }
.hotspot { position:absolute; display:flex; align-items:center; gap:12px; padding:12px; min-height:48px; background:transparent; border:0; pointer-events:auto; text-align:left; }
.hotspot .marker { display:grid; place-items:center; width:29px; height:29px; border:1px solid #ddc492aa; border-radius:50%; font:11px Georgia,serif; color:#ffe6b9; background:#0e283a66; box-shadow:0 0 0 6px #d5b47a0c; transition:box-shadow .25s,background .25s; }
.hotspot .label { display:block; font-family:"Songti SC","STSong","SimSun",serif; font-size:15px; letter-spacing:.15em; text-shadow:0 2px 10px #001421; }
.hotspot .hint { display:block; font-size:9px; letter-spacing:.1em; color:#cad0c5; margin-top:6px; opacity:0; transform:translateY(4px); transition:opacity .25s,transform .25s; }
.hotspot:hover .marker,.hotspot:focus-visible .marker { background:#d8bd8366; box-shadow:0 0 0 8px #d5b47a20,0 0 25px #d5b47a30; }
.hotspot:hover .hint,.hotspot:focus-visible .hint { opacity:1; transform:none; }
.hotspot[data-scene="cloud"] { left:43%; top:65%; }
.hotspot[data-scene="courtyard"] { left:65%; top:48%; }
.hotspot[data-scene="tower"] { left:80%; top:29%; }
.scene-controls { position:absolute; left:4.8%; right:4.8%; bottom:max(28px,env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; gap:20px; z-index:4; padding-top:21px; border-top:1px solid #c9c7af26; }
.view-note { font-size:10px; letter-spacing:.12em; color:#bfc9c5; line-height:1.8; }
.view-note span { color:var(--copper); margin-right:14px; }
.control-right { display:flex; align-items:center; gap:28px; }
.coordinate { color:#aebbb6; font:10px Georgia,serif; letter-spacing:.15em; }
.motion-button { min-height:44px; display:flex; align-items:center; gap:9px; border:1px solid #d4b78355; background:#0c233666; padding:0 17px; font-size:10px; letter-spacing:.08em; border-radius:2px; }
.motion-button:hover:not(:disabled) { border-color:#e4c790; background:#d4b7831c; }
.motion-icon { width:9px; height:10px; border-left:2px solid currentColor; border-right:2px solid currentColor; }
[aria-pressed="true"] .motion-icon { height:0; width:0; border:5px solid transparent; border-left:8px solid currentColor; margin-right:-4px; }
.motion-button:disabled { color:#c1c9bd; border-color:#c1c9bd44; }
.scene-transition { position:absolute; inset:0; z-index:10; pointer-events:none; display:grid; place-content:center; text-align:center; opacity:0; background:#0b1b28; transition:opacity 280ms ease; }
.scene-transition span { display:block; font:24px "Songti SC","SimSun",serif; letter-spacing:.25em; }
.scene-transition small { color:var(--copper); margin-top:16px; font-size:9px; letter-spacing:.35em; }
.is-transitioning .scene-transition { opacity:1; pointer-events:auto; }
.scene-art { display:none; }
[data-scene="home"] .art-home,[data-scene="cloud"] .art-cloud,[data-scene="courtyard"] .art-courtyard,[data-scene="tower"] .art-tower { display:inline; }
[data-scene="courtyard"] .atmosphere { background:linear-gradient(90deg,#081c2dbb,transparent 55%),linear-gradient(0deg,#071622ee,transparent 28%); }
[data-scene="tower"] .atmosphere { background:linear-gradient(90deg,#091c2dcc,transparent 58%),linear-gradient(0deg,#071622ee,transparent 25%); }
.interactive { display:none; }
.is-ready .interactive { display:flex; }
.is-ready .scene-hotspots:not([hidden]) { display:block; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
noscript { position:absolute; z-index:5; bottom:95px; left:4.8%; right:4.8%; padding:12px 16px; background:#0b2136dd; color:#e8dec3; font-size:12px; line-height:1.8; }
.cloud-near { animation:cloud-drift 50s ease-in-out infinite alternate; }
.cloud-far { animation:cloud-drift 80s ease-in-out infinite alternate-reverse; }
.floating { animation:city-float 10s ease-in-out infinite; }
.sun-glow { animation:glow-pulse 9s ease-in-out infinite alternate; }
.birds { animation:bird-flight 34s linear infinite; }
.birds.slow { animation-duration:49s; animation-delay:-21s; }
.mote { animation:mote-shimmer 6s ease-in-out infinite; }
.mote:nth-child(2n) { animation-delay:-2s; }
.mote:nth-child(3n) { animation-delay:-4s; }
.is-paused .ambient,.is-paused .ambient::before,.is-paused .ambient::after { animation-play-state: paused !important; }
.scene-app:not(.is-ready) .ambient { animation:none !important; }
@keyframes cloud-drift { from { transform:translateX(-28px); } to { transform:translateX(36px); } }
@keyframes city-float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
@keyframes glow-pulse { from { opacity:.45; } to { opacity:.85; } }
@keyframes bird-flight { from { transform:translate(-230px,25px); } to { transform:translate(330px,-28px); } }
@keyframes mote-shimmer { 0%,100% { opacity:.15; } 50% { opacity:.85; } }
@media (min-width:1800px) { .scene-copy { left:10%; } }
@media (max-width: 720px) {
 .scene-stage { min-height:720px; }
 .scene-topbar { top:max(22px,env(safe-area-inset-top)); left:24px; right:24px; }
 .wordmark { font-size:10px; gap:11px; }
 .wordmark small { font-size:8px; }
 .top-actions { gap:10px; }
 .scene-app:not([data-scene="home"]) .top-actions .mode-label { display:none; }
 .mode-label { font-size:9px; letter-spacing:0; }
 .text-button { font-size:10px; padding-left:0; }
 .scene-copy { left:28px; top:16%; width:calc(100% - 56px); max-width:400px; }
 .eyebrow { font-size:8px; margin-bottom:17px; letter-spacing:.28em; }
 h1 { font-size:48px; letter-spacing:.13em; margin-bottom:13px; }
 .scene-tagline { font-size:16px; letter-spacing:.1em; }
 .copy-divider { margin:16px 0 12px; }
 #scene-description { font-size:10px; line-height:1.95; max-width:265px; }
 .scene-index { display:none; }
 .art-layer { width:170svh; min-width:1224px; left:50%; right:auto; transform:translateX(-61.8%); }
 .art-home { transform-origin:992px 530px; transform:translateY(90px) scale(.76); }
 .cloud-city { transform-origin:1065px 400px; transform:translate(-30px,90px) scale(.8); }
 .tower-light { transform:translateX(-120px); }
 #sun-tower { transform-origin:1000px 560px; transform:translateY(75px) scale(.82); }
 .atmosphere { background:linear-gradient(180deg,#091c2d88,transparent 52%),linear-gradient(0deg,#071622f5,transparent 34%); }
 .is-ready .scene-hotspots:not([hidden]) { inset:auto 22px 111px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
 .hotspot[data-scene] { position:relative; left:auto; top:auto; display:flex; flex-direction:column; gap:10px; align-items:center; padding:12px 2px; background:#0b223747; border-top:1px solid #c9b68155; text-align:center; min-height:81px; }
 .hotspot .marker { width:24px; height:24px; font-size:10px; }
 .hotspot .label { font-size:12px; letter-spacing:.07em; }
 .hotspot .hint { display:none; }
 .scene-controls { left:24px; right:24px; bottom:max(23px,env(safe-area-inset-bottom)); gap:10px; padding-top:12px; }
 .view-note { font-size:9px; letter-spacing:.06em; max-width:170px; }
 .view-note span { display:block; margin-right:0; }
 .control-right { gap:0; }
 .coordinate { display:none; }
 .motion-button { padding:0 10px; font-size:9px; }
 .vignette { box-shadow:inset 0 0 90px #08182666; }
 [data-scene="courtyard"] .atmosphere,[data-scene="tower"] .atmosphere { background:linear-gradient(180deg,#091c2da8,transparent 56%),linear-gradient(0deg,#071622f0,transparent 34%); }
 noscript { bottom:95px; }
}
@media (max-width:360px) { .scene-topbar { left:18px; right:18px; } .brand-seal { width:23px; height:23px; } .wordmark { font-size:9px; } .top-actions .mode-label { display:none; } .scene-copy { left:22px; width:calc(100% - 44px); } h1 { font-size:41px; } .view-note { max-width:140px; } }
@media (min-width:721px) and (max-height:660px) { .scene-stage { height:660px; } .scene-copy { top:22%; } h1 { font-size:54px; } .copy-divider { margin:20px 0 15px; } }
@media (prefers-reduced-motion: reduce) { .ambient { animation:none !important; } *,*::before,*::after { transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>

<script>
(() => {
 'use strict';
 const scenes = {
  home:{title:'天空之城',tagline:'云的尽头，风的故乡。',description:'在云海之上，寻找一座不会坠落的城。\n让目光停留，让时间慢下来。',number:'00',english:'THE FLOATING CITY',eyebrow:'LAPUTA · A QUIET JOURNEY',note:'点击画面入口，走进这座城。',detail:'暮色 · 云海 · 古老的风'},
  cloud:{title:'云海远景',tagline:'万里长风，托起一座孤城。',description:'晚霞沉入层叠的云，飞鸟掠过天际。\n远方的城，像一个尚未醒来的梦。',number:'01',english:'AN OCEAN OF CLOUDS',eyebrow:'CHAPTER I · THE HORIZON',note:'此刻，只有风与云经过。',detail:'按 Esc 返回全景'},
  courtyard:{title:'城堡中庭',tagline:'树根深处，藏着时间的回声。',description:'拱廊渐渐被藤蔓覆盖，石阶通向巨树。\n那些被遗忘的岁月，仍然在这里生长。',number:'02',english:'THE ANCIENT GARDEN',eyebrow:'CHAPTER II · THE ROOTS',note:'停一会儿，听树叶的低语。',detail:'按 Esc 返回全景'},
  tower:{title:'高塔夕照',tagline:'在风的最高处，与落日相逢。',description:'铜金色的光，沿着古老塔楼缓缓落下。\n群山与云海，把最后的黄昏交给你。',number:'03',english:'THE LAST GOLDEN LIGHT',eyebrow:'CHAPTER III · THE SUNLIGHT',note:'把这一束光，留在记忆里。',detail:'按 Esc 返回全景'}
 };
 const app=document.getElementById('scene-app');
 const title=document.getElementById('scene-title');
 const description=document.getElementById('scene-description');
 const tagline=document.getElementById('scene-tagline');
 const eyebrow=document.getElementById('scene-eyebrow');
 const number=document.getElementById('scene-number');
 const english=document.getElementById('scene-english');
 const hotspots=document.getElementById('scene-hotspots');
 const back=document.getElementById('back-home');
 const motion=document.getElementById('motion-toggle');
 const motionLabel=document.getElementById('motion-label');
 const mode=document.getElementById('mode-label');
 const note=document.getElementById('view-note');
 const transitionTitle=document.getElementById('transition-title');
 const status=document.getElementById('scene-status');
 const preference=window.matchMedia('(prefers-reduced-motion: reduce)');
 let current='home', transitioning=false, manuallyPaused=false, returnTarget=null;
 let switchTimer=null, endTimer=null, transitionFrame=null, pending=null;
 const textWithLines=(element,text) => {
  element.replaceChildren();
  text.split('\n').forEach((line,index) => {
   if(index) element.append(document.createElement('br'));
   element.append(document.createTextNode(line));
  });
 };
 function render(scene,focus=false) {
  current=scene;
  const config=scenes[scene];
  app.dataset.scene=scene;
  title.textContent=config.title;
  tagline.textContent=config.tagline;
  textWithLines(description,config.description);
  eyebrow.textContent=config.eyebrow;
  number.textContent=config.number;
  english.textContent=config.english;
  back.hidden=scene==='home';
  hotspots.hidden=scene!=='home';
  const lead=document.createElement('span'); lead.textContent=config.note;
  note.replaceChildren(lead,document.createTextNode(config.detail));
  document.title=config.title+' · 云上漫游';
  if(focus) {
   status.textContent='当前场景：'+config.title;
   if(scene==='home' && returnTarget?.isConnected) returnTarget.focus({preventScroll:true});
   else title.focus({preventScroll:true});
  }
 }
 function unlock() {
  app.classList.remove('is-transitioning');
  app.removeAttribute('aria-busy');
  transitioning=false; pending=null;
 }
 function goToScene(requested,trigger=null) {
  if(transitioning) return;
  const next=Object.hasOwn(scenes,requested)?requested:'home';
  if(next===current) return;
  if(current==='home' && trigger) returnTarget=trigger;
  if(preference.matches) { render(next,true); return; }
  transitioning=true; pending=next;
  app.setAttribute('aria-busy','true');
  transitionTitle.textContent=scenes[next].title;
  transitionFrame=requestAnimationFrame(() => {
   transitionFrame=null;
   app.classList.add('is-transitioning');
   switchTimer=setTimeout(() => {
    switchTimer=null;
    render(next,true);
    app.classList.remove('is-transitioning');
    endTimer=setTimeout(() => {endTimer=null;unlock();},320);
   },330);
  });
 }
 function syncMotion() {
  const reduced=preference.matches;
  app.classList.toggle('is-paused',manuallyPaused || reduced || document.hidden);
  motion.disabled=reduced;
  motion.setAttribute('aria-pressed',String(manuallyPaused));
  motionLabel.textContent=reduced?'静态观赏':manuallyPaused?'继续动画':'暂停动画';
  motion.setAttribute('aria-label',reduced?'系统已启用减少动态效果':manuallyPaused?'继续装饰动画':'暂停装饰动画');
  mode.textContent=reduced?'减少动态 · 静态观赏':manuallyPaused?'观赏模式 · 已暂停':'观赏模式 · 自动播放';
 }
 hotspots.querySelectorAll('button[data-scene]').forEach(button => {
  button.addEventListener('click',() => goToScene(button.dataset.scene,button));
 });
 back.addEventListener('click',() => goToScene('home'));
 motion.addEventListener('click',() => {manuallyPaused=!manuallyPaused;syncMotion();});
 document.addEventListener('keydown',event => {if(event.key==='Escape') goToScene('home');});
 document.addEventListener('visibilitychange',syncMotion);
 preference.addEventListener('change',() => {
  if(preference.matches && transitioning) {
   if(transitionFrame!==null) cancelAnimationFrame(transitionFrame);
   clearTimeout(switchTimer); clearTimeout(endTimer);
   transitionFrame=switchTimer=endTimer=null;
   if(pending) render(pending,true);
   unlock();
  }
  syncMotion();
 });
 render('home'); syncMotion(); app.classList.add('is-ready');
})();
</script>
