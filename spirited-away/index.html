<script id="scene-engine">
(()=>{
 'use strict';
 function create({ids,home='bathhouse',schedule=setTimeout,cancel=clearTimeout,onCommit=()=>{},onChange=()=>{}}){
  const state={scene:home,busy:false,paused:false,touring:false,reduced:false,hidden:false};
  let transitionTimer=null,tourTimer=null,disposed=false;
  const clearTour=()=>{if(tourTimer!==null)cancel(tourTimer);tourTimer=null;};
  const notify=()=>onChange({...state});
  function armTour(){clearTour();if(disposed||!state.touring||state.busy||state.reduced||state.hidden)return;tourTimer=schedule(()=>{tourTimer=null;step(1,false);},25000);}
  function unlock(){transitionTimer=null;state.busy=false;notify();armTour();}
  function stopTour(){state.touring=false;clearTour();}
  function goTo(requested,manual=true){
   if(disposed||state.busy)return false;
   const next=ids.includes(requested)?requested:home;
   if(manual)stopTour();
   if(next===state.scene){notify();return false;}
   clearTour();state.scene=next;state.busy=!state.reduced;
   onCommit(next);notify();
   if(state.busy)transitionTimer=schedule(unlock,650);else armTour();
   return true;
  }
  function step(delta,manual=true){const index=ids.indexOf(state.scene);return goTo(ids[(index+delta+ids.length)%ids.length],manual);}
  return {state,goTo,step,
   toggleMotion(){if(disposed)return;state.paused=!state.paused;notify();},
   toggleTour(){if(disposed)return;state.touring=!state.touring;if(state.reduced&&state.touring)state.touring=false;notify();armTour();},
   setReduced(value){state.reduced=!!value;if(state.reduced&&transitionTimer!==null){cancel(transitionTimer);transitionTimer=null;state.busy=false;}notify();armTour();},
   setHidden(value){state.hidden=!!value;notify();armTour();},
   stopTour(){stopTour();notify();},
   dispose(){disposed=true;clearTour();if(transitionTimer!==null)cancel(transitionTimer);transitionTimer=null;state.busy=false;}
  };
 }
 globalThis.SpiritEngine={create};
})();
</script>

 {id:'balcony',number:'08',title:'临海木廊',english:'A MOMENT BY THE SEA',chapter:2,caption:'在一切忙碌之外，还有一片安静的海。',image:'assets/08-balcony.webp',mobile:'48% 50%',effects:'water',hotspots:[{to:'station',label:'去往站台',x:62,y:58}],note:'停一会儿，让风经过。'},
 {id:'station',number:'09',title:'海面站台',english:'WAITING ON THE WATER',chapter:3,caption:'铁轨延伸到天际，下一班列车，开往海的尽头。',image:'assets/09-station.webp',mobile:'25% 50%',effects:'water',hotspots:[{to:'train',label:'登上列车',x:62,y:55}],note:'不必着急，列车总会来的。'},
 {id:'train',number:'10',title:'海上列车',english:'THE SEA TRAIN',chapter:3,caption:'窗外的水面缓缓后退，身旁的沉默不再让人害怕。',image:'assets/10-train.webp',mobile:'55% 50%',mobileImage:'assets/10-train-mobile.webp',effects:'window',hotspots:[{to:'cottage',label:'在森林下车',x:76,y:49}],note:'有些旅程，安静地走就很好。'},
 {id:'cottage',number:'11',title:'森林小屋',english:'A LIGHT IN THE WOODS',chapter:3,caption:'一扇亮着灯的窗，让漫长的夜路有了归处。',image:'assets/11-cottage.webp',mobile:'52% 50%',effects:'fireflies',hotspots:[{to:'detail',label:'看看小屋',x:55,y:58},{to:'dragon',label:'启程归去',x:77,y:64}],note:'一盏灯，就是一份接纳。'},
 {id:'dragon',number:'12',title:'白龙夜航',english:'REMEMBERING THE RIVER',chapter:3,caption:'当你想起那条河，夜空也变成了回家的方向。',image:'assets/12-dragon.webp',mobile:'8% 50%',effects:'clouds',hotspots:[{to:'tunnel',label:'回到故事起点',x:71,y:61}],note:'把名字和来路，一起带回家。'}
];
</script>
<script id="scene-ui">
(()=>{
 'use strict';
 const el=id=>document.getElementById(id),gallery=el('gallery'),frame=el('art-frame'),picture=el('picture'),image=el('scene-image'),incoming=el('incoming-image'),directory=el('scene-directory'),detail=el('scene-detail');
 const scenes=SpiritScenes,chapters=['','误入异界','汤屋灯火','海上归途'],chapterEnglish=['','THE OTHER SIDE','THE BATHHOUSE','THE WAY HOME'];
 const preference=matchMedia('(prefers-reduced-motion: reduce)'),mobile=matchMedia('(max-width:720px)'),compact=matchMedia('(max-width:360px)');
 let imageToken=0,fadeTimer=null,returnFocus=null,previousScene='bathhouse',imageLoading=false,renderedId='bathhouse',sourceVariant='',modalHidden=false;
 const caches=new Map();
 const sourceFor=s=>mobile.matches&&s.mobileImage?s.mobileImage:s.image;
 function preload(source){if(caches.has(source))return caches.get(source);const task=new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=source;});caches.set(source,task);return task;}
 function fitPicture(){
  const scene=scenes.find(s=>s.id===renderedId),w=frame.clientWidth,h=frame.clientHeight;
  if(mobile.matches){Object.assign(picture.style,{width:w+'px',height:h+'px',left:'0',top:'0'});image.style.objectPosition=incoming.style.objectPosition=scene.mobile;}
  else{const ratio=(image.naturalWidth||1672)/(image.naturalHeight||941),width=Math.min(w,h*ratio),height=width/ratio;Object.assign(picture.style,{width:width+'px',height:height+'px',left:(w-width)/2+'px',top:(h-height)/2+'px'});image.style.objectPosition=incoming.style.objectPosition='50% 50%';}
 }
 function renderEffects(scene){
  const effects=el('scene-effects');effects.replaceChildren();
  const make=(kind,x,y,delay=0)=>{const item=document.createElement('i');item.className=kind+' ambient';item.style.left=x+'%';item.style.top=y+'%';item.style.animationDelay=delay+'s';effects.append(item);};
  if(['lamps','furnace','dust','fireflies','leaves'].includes(scene.effects))for(let i=0;i<(scene.effects==='fireflies'?15:8);i++)make('mote',15+(i*29)%73,21+(i*17)%50,-i*.8);
  if(['lamps','furnace'].includes(scene.effects))make('warm-glow',scene.effects==='furnace'?55:40,40);
  if(['steam','furnace','lamps'].includes(scene.effects)){make('steam',scene.effects==='lamps'?10:52,scene.effects==='lamps'?2:24);if(scene.effects==='steam')make('steam',30,18,-7);}
  if(scene.effects==='water')make('water-glint',23,61);
  if(scene.effects==='window')make('window-glint',28,3);
  if(scene.effects==='clouds'){make('cloud-mist',-4,20);make('cloud-mist',45,48,-10);}
 }
 function renderHotspots(scene){
  const nav=el('scene-hotspots');nav.replaceChildren();
  scene.hotspots.forEach((point,index)=>{const button=document.createElement('button');button.className='hotspot';button.type='button';button.dataset.target=point.to;button.style.left=point.x+'%';button.style.top=point.y+'%';button.style.transform='translate(-50%,-50%)';button.setAttribute('aria-label',point.label+'，'+(point.to==='detail'?'查看森林小屋局部细节':'进入'+scenes.find(s=>s.id===point.to).title));const dot=document.createElement('span');dot.className='hotspot-dot';dot.setAttribute('aria-hidden','true');const label=document.createElement('span');label.className='hotspot-label';label.textContent=point.label;const arrow=document.createElement('span');arrow.className='hotspot-arrow';arrow.textContent='→';arrow.setAttribute('aria-hidden','true');button.append(dot,label,arrow);button.addEventListener('click',()=>{returnFocus={scene:scene.id,index};if(point.to==='detail')openDetail(button);else spirit.goTo(point.to);});nav.append(button);});
  if(mobile.matches){[...nav.children].forEach((button,index)=>{button.style.left=(scene.hotspots.length===1?62:scene.hotspots.length===2?28+index*42:20+index*30)+'%';button.style.top='62%';});}
 }
 async function displayScene(id,focus=true){
  const scene=scenes.find(s=>s.id===id),token=++imageToken,source=sourceFor(scene);renderedId=id;sourceVariant=source;
  clearTimeout(fadeTimer);incoming.hidden=true;incoming.classList.remove('visible');
  gallery.dataset.scene=id;el('scene-title').textContent=scene.title;el('scene-caption').textContent=scene.caption;el('scene-number').textContent=scene.number;el('scene-english').textContent=scene.english;el('scene-eyebrow').textContent='CHAPTER '+['','I','II','III'][scene.chapter]+' · '+chapterEnglish[scene.chapter];el('chapter-name').textContent=['','第一章','第二章','第三章'][scene.chapter]+' · '+chapters[scene.chapter];el('journey-note').textContent=scene.note;document.title=scene.title+' · 千与千寻';
  imageLoading=true;el('image-loading').hidden=false;el('asset-error').hidden=true;renderHotspots(scene);renderEffects(scene);fitPicture();
  directory.querySelectorAll('.scene-card').forEach(button=>button.setAttribute('aria-current',String(button.dataset.target===id)));
  if(focus){el('scene-status').textContent='当前场景：'+scene.title;el('scene-title').focus({preventScroll:true});}
  const next=await preload(source);if(token!==imageToken)return;
  imageLoading=false;el('image-loading').hidden=true;
  if(!next){el('asset-error').textContent='这幅画暂时没有加载成功。请确认 assets 文件夹完整保留。你仍可使用目录或下一景继续漫游。';el('asset-error').hidden=false;image.alt=scene.title+'：图片加载失败';return;}
  if(preference.matches||!focus){image.src=source;image.alt=scene.title+'。'+scene.caption;el('backdrop').style.backgroundImage='url("'+source+'")';fitPicture();}
  else{incoming.src=source;incoming.hidden=false;requestAnimationFrame(()=>incoming.classList.add('visible'));fadeTimer=setTimeout(()=>{if(token!==imageToken)return;image.src=source;image.alt=scene.title+'。'+scene.caption;incoming.classList.remove('visible');incoming.hidden=true;el('backdrop').style.backgroundImage='url("'+source+'")';fitPicture();},610);}
  const index=scenes.findIndex(s=>s.id===id);preload(sourceFor(scenes[(index+1)%scenes.length]));preload(sourceFor(scenes[(index+scenes.length-1)%scenes.length]));
 }
 function sync(state){
  gallery.classList.toggle('is-paused',state.paused||state.reduced||state.hidden||modalHidden);gallery.classList.toggle('is-changing',state.busy);if(state.busy)gallery.setAttribute('aria-busy','true');else gallery.removeAttribute('aria-busy');
  el('motion-toggle').setAttribute('aria-pressed',String(state.paused));el('motion-toggle').disabled=state.reduced;el('motion-label').textContent=compact.matches?(state.reduced?'静态':state.paused?'继续':'暂停'):(state.reduced?'静态观赏':state.paused?'继续动画':'暂停动画');el('motion-toggle').setAttribute('aria-label',state.reduced?'系统已启用减少动态效果':state.paused?'继续装饰动画':'暂停装饰动画');
  el('tour-toggle').setAttribute('aria-pressed',String(state.touring));el('tour-toggle').disabled=state.reduced&&!state.touring;el('tour-label').textContent=compact.matches?(state.touring?'停止':'巡游'):(state.touring?'停止巡游':'自动巡游');el('tour-toggle').setAttribute('aria-label',state.touring?'停止自动巡游':'开始自动巡游，每景停留约25秒');
  el('journey-mode').textContent=state.reduced?'减少动态 · 静态观赏':state.touring?'自动巡游 · 每景约25秒':state.paused?'动画已暂停 · 可继续漫游':'自由漫游 · ← → 切换场景';
  const running=state.touring&&!state.busy&&!state.reduced&&!state.hidden&&!modalHidden;gallery.classList.toggle('tour-running',running);
  ['previous-scene','next-scene','home-scene'].forEach(id=>el(id).disabled=state.busy);
  if(previousScene!==state.scene){previousScene=state.scene;gallery.classList.remove('tour-running');requestAnimationFrame(()=>{if(spirit.state.touring&&!spirit.state.busy&&!spirit.state.hidden&&!spirit.state.reduced&&!modalHidden)gallery.classList.add('tour-running');});}
 }
 const spirit=SpiritEngine.create({ids:scenes.map(s=>s.id),onCommit:id=>displayScene(id),onChange:sync});window.spirit=spirit;
 const directoryBody=el('directory-body');for(let chapter=1;chapter<=3;chapter++){const heading=document.createElement('h3');heading.className='chapter-heading';heading.textContent=['','第一章','第二章','第三章'][chapter]+' · '+chapters[chapter];const sub=document.createElement('span');sub.textContent=chapterEnglish[chapter];heading.append(sub);const grid=document.createElement('div');grid.className='scene-grid';scenes.filter(s=>s.chapter===chapter).forEach(scene=>{const button=document.createElement('button');button.className='scene-card';button.type='button';button.dataset.target=scene.id;button.setAttribute('aria-label','进入'+scene.title);const thumb=document.createElement('img');thumb.src=scene.image.replace('.webp','-thumb.webp');thumb.alt='';thumb.loading='lazy';const meta=document.createElement('span');meta.className='card-meta';const number=document.createElement('span');number.textContent=scene.number;const title=document.createElement('strong');title.textContent=scene.title;meta.append(number,title);button.append(thumb,meta);button.addEventListener('click',()=>{modalFocus=null;closeModal(directory);if(!spirit.goTo(scene.id))el('scene-title').focus({preventScroll:true});});grid.append(button);});directoryBody.append(heading,grid);}
 let modalFocus=null;
 function openModal(dialog,trigger){if(spirit.state.busy)return;modalFocus=trigger;modalHidden=true;spirit.setHidden(true);dialog.showModal();if(dialog===directory){const current=dialog.querySelector('[aria-current=true]');(current||el('directory-close')).focus({preventScroll:true});}}
 function closeModal(dialog){dialog.close();}
 function modalClosed(){modalHidden=false;spirit.setHidden(document.hidden);if(modalFocus?.isConnected)modalFocus.focus({preventScroll:true});else el('scene-title').focus({preventScroll:true});modalFocus=null;}
 function openDetail(trigger){el('detail-image').src='assets/11-cottage-detail.webp';openModal(detail,trigger);}
 el('directory-toggle').addEventListener('click',event=>openModal(directory,event.currentTarget));el('directory-close').addEventListener('click',()=>closeModal(directory));el('detail-close').addEventListener('click',()=>closeModal(detail));[directory,detail].forEach(dialog=>{dialog.addEventListener('close',modalClosed);dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal(dialog);}});});
 el('previous-scene').addEventListener('click',()=>spirit.step(-1));el('next-scene').addEventListener('click',()=>spirit.step(1));el('home-scene').addEventListener('click',()=>spirit.goTo('bathhouse'));el('motion-toggle').addEventListener('click',()=>spirit.toggleMotion());el('tour-toggle').addEventListener('click',()=>spirit.toggleTour());
 document.addEventListener('keydown',event=>{if(directory.open||detail.open)return;if(event.key==='ArrowRight'){event.preventDefault();spirit.step(1);}else if(event.key==='ArrowLeft'){event.preventDefault();spirit.step(-1);}else if(event.key==='Escape')spirit.goTo('bathhouse');});
 document.addEventListener('visibilitychange',()=>spirit.setHidden(document.hidden||modalHidden));
 preference.addEventListener('change',()=>{spirit.setReduced(preference.matches);if(preference.matches){clearTimeout(fadeTimer);displayScene(spirit.state.scene,false);}});
 mobile.addEventListener('change',()=>{const scene=scenes.find(s=>s.id===spirit.state.scene);if(sourceFor(scene)!==sourceVariant)displayScene(scene.id,false);else{fitPicture();renderHotspots(scene);}});new ResizeObserver(fitPicture).observe(frame);image.addEventListener('load',fitPicture);
 if(document.fullscreenEnabled&&gallery.requestFullscreen){el('fullscreen-toggle').hidden=false;el('fullscreen-toggle').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await gallery.requestFullscreen();}catch{el('scene-status').textContent='当前浏览器暂不能进入全屏，仍可正常观赏。';}});document.addEventListener('fullscreenchange',()=>{el('fullscreen-toggle').setAttribute('aria-label',document.fullscreenElement?'退出全屏观赏':'进入全屏观赏');fitPicture();});}
 compact.addEventListener('change',()=>sync(spirit.state));spirit.setReduced(preference.matches);spirit.setHidden(document.hidden);displayScene('bathhouse',false);gallery.classList.add('is-ready');
 window.addEventListener('pagehide',event=>{clearTimeout(fadeTimer);imageToken++;if(event.persisted)spirit.setHidden(true);else spirit.dispose();});
 window.addEventListener('pageshow',event=>{if(event.persisted){spirit.setHidden(document.hidden||modalHidden);displayScene(spirit.state.scene,false);}});
})();
</script>
